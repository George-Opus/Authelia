# ============================================================
# Partie 1 : ressources gérées par CE chart (templates/)
# ============================================================
cnpg:
  enabled: true
  clusterName: authelia-db
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.4
  storageClass: local-path
  size: 2Gi
  database: authelia
  owner: authelia
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

users:
  create: true
  secretName: authelia-users
  entries:
    benjamin:
      displayname: "Benjamin"
      password: "CHANGEME_HASH_ARGON2"
      email: benjamin@georgeop.us
      groups:
        - admins
# ============================================================
# Partie 2 : values du chart officiel Authelia
# Structure alignée sur la référence (helm show values, chart 0.10.x)
# ============================================================
authelia:
  pod:
    kind: Deployment
    replicas: 1

  ingress:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls:
      enabled: true
      secret: authelia-tls
    # NOTE: pas de host ici - le chart le dérive de
    # configMap.session.cookies (subdomain + domain)

  secret:
    # Le chart génère automatiquement les secrets non fournis
    # (session/storage encryption keys, jwt reset, hmac oidc).
    # On monte en plus nos secrets applicatifs sous /secrets/<nom>/<clé> :
    additionalSecrets:
      authelia-db-app: {}      # secret CNPG (mot de passe PostgreSQL)
      authelia-users: {}       # users_database.yml (backend fichier)
      authelia-oidc-jwk: {}    # clé privée RSA de signature OIDC

  configMap:
    theme: 'dark'

    totp:
      issuer: 'georgeop.us'

    authentication_backend:
      file:
        enabled: true
        path: '/secrets/authelia-users/users_database.yml'
        watch: false
        password:
          algorithm: 'argon2'

    session:
      cookies:
        - subdomain: 'auth'
          domain: 'georgeop.us'
          default_redirection_url: 'https://opencloud.georgeop.us'

    storage:
      postgres:
        enabled: true
        address: 'tcp://authelia-db-rw:5432'
        database: 'authelia'
        username: 'authelia'
        password:
          secret_name: 'authelia-db-app'
          path: 'password'

    notifier:
      filesystem:
        enabled: true
        filename: '/config/notification.txt'

    access_control:
      default_policy: 'deny'
      rules:
        - domain: '*.georgeop.us'
          policy: 'two_factor'

    identity_providers:
      oidc:
        enabled: true
        # hmac_secret: généré par le chart si non fourni
        jwks:
          - key_id: 'main'
            algorithm: 'RS256'
            use: 'sig'
            key:
              path: '/secrets/authelia-oidc-jwk/tls.key'
        clients:
          - client_id: 'opencloud'
            client_name: 'OpenCloud'
            public: true
            require_pkce: true
            pkce_challenge_method: 'S256'
            redirect_uris:
              - 'https://opencloud.georgeop.us/'
              - 'https://opencloud.georgeop.us/oidc-callback.html'
              - 'https://opencloud.georgeop.us/oidc-silent-redirect.html'
            scopes: ['openid', 'profile', 'email', 'groups']
            authorization_policy: 'two_factor'
          - client_id: 'immich'
            client_name: 'Immich'
            #client_secret: 'CHANGEME_HASH_PBKDF2'
            redirect_uris:
              - 'https://photos.georgeop.us/auth/login'
              - 'https://photos.georgeop.us/user-settings'
              - 'app.immich:///oauth-callback'
            scopes: ['openid', 'profile', 'email']
            authorization_policy: 'two_factor'
